protocols = imap pop3
listen = *
ssl = required
ssl_cert = </certs/server.pem
ssl_key = </certs/server.key
auth_mechanisms = plain login
auth_username_format = %n
disable_plaintext_auth = yes
passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/dovecot/test-users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/mail/%n
}
mail_location = maildir:~/Maildir
first_valid_uid = 1000
namespace inbox {
  inbox = yes
  mailbox Sent {
    auto = subscribe
  }
  mailbox Trash {
    auto = subscribe
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
log_path = /tmp/dovecot.log

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
